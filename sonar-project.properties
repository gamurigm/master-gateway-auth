sonar.projectKey=master-gateway
sonar.projectName=Master Gateway
sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000

sonar.sources=backend/src,frontend/src,services/ventas/src
sonar.tests=backend/src,backend/test,services/ventas/src
sonar.test.inclusions=backend/src/**/*.spec.ts,backend/test/**/*.ts,services/ventas/src/**/*.spec.ts

# security/fixtures contiene codigo vulnerable a proposito para probar el agente SAST.
# Debe quedar fuera de Sonar igual que queda fuera del escaneo por defecto de CodeBERT.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,backend/prisma/migrations/**,frontend/dist/**,security/fixtures/**
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
