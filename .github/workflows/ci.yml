name: CI/CD

on:
  pull_request:
    branches:
      - dev
      - test
      - main
  push:
    branches:
      - dev
      - test
      - main

jobs:
  # ──────────────────────────────────────────────────────────────
  # ESTRATEGIA 1: Detectar si hay cambios en código fuente
  # Permite fast-path para commits de docs/config
  # ──────────────────────────────────────────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      has_code: ${{ steps.filter.outputs.has_code }}
      has_security_relevant: ${{ steps.filter.outputs.has_security_relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
        id: filter
        with:
          filters: |
            has_code:
              - 'backend/src/**/*.ts'
              - 'frontend/src/**/*.ts'
              - 'frontend/src/**/*.tsx'
              - 'frontend/src/**/*.html'
              - 'frontend-vue/src/**/*.ts'
              - 'frontend-vue/src/**/*.vue'
              - 'services/**/*.ts'
            has_security_relevant:
              - 'backend/src/**/*.ts'
              - 'frontend/src/**/*.ts'
              - 'frontend/src/**/*.tsx'
              - 'frontend-vue/src/**/*.ts'
              - 'frontend-vue/src/**/*.vue'
              - 'services/**/*.ts'
              - 'backend/prisma/schema.prisma'
              - 'security/**'

  # ──────────────────────────────────────────────────────────────
  # Build + Tests (siempre corre, es la base de todo)
  # ──────────────────────────────────────────────────────────────
  build-test:
    needs: detect-changes
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/master_gateway?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate --schema backend/prisma/schema.prisma

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Backend build
        run: npm run build:backend

      - name: Backend unit tests
        run: npm run test -w backend -- --runInBand

      - name: Backend e2e tests
        run: npm run test:e2e -w backend -- --runInBand

      - name: Ventas build
        run: npm run build -w ventas

      - name: Ventas tests
        run: npm run test -w ventas

      - name: Inventario build
        run: npm run build -w inventario

      - name: Inventario tests
        run: npm run test -w inventario

      - name: Frontend build (Vue)
        run: npm run build:frontend

  # ──────────────────────────────────────────────────────────────
  # ESTRATEGIA 2 + 4: SonarQube corre ANTES de CodeBERT en main
  # y produce gate_status como output para el filtro condicional
  # ──────────────────────────────────────────────────────────────
  sonarqube:
    name: sonarqube-community
    # ESTRATEGIA 4: Solo en push a main (rigor máximo)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      gate_status: ${{ steps.read_gate.outputs.gate_status }}
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/master_gateway?schema=public
      SONAR_HOST_URL: http://localhost:9000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Backend coverage
        run: npm run test:coverage

      - name: Start SonarQube Community
        run: |
          set -euo pipefail
          docker compose up -d sonar-db sonarqube
          echo "Waiting for SonarQube to be ready..."
          STATUS="DOWN"
          for i in $(seq 1 60); do
            STATUS=$(curl -s -f "http://localhost:9000/api/system/status" 2>/dev/null | jq -r '.status' 2>/dev/null || echo "DOWN")
            if [ "$STATUS" = "UP" ]; then
              echo "SonarQube is ready!"
              break
            fi
            echo "Attempt $i: status=$STATUS, waiting 10s..."
            sleep 10
          done
          if [ "$STATUS" != "UP" ]; then
            echo "::error::SonarQube Community did not become ready"
            docker compose logs --no-color --tail=100 sonar-db sonarqube
            exit 1
          fi

      - name: Generate SonarQube token
        run: |
          TOKEN=$(curl -s -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate" \
            -d "name=ci-$(date +%s)" | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to generate SonarQube token"
            docker compose logs sonarqube --tail=20
            exit 1
          fi
          echo "SONAR_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: SonarQube analysis
        id: sonar_analysis
        continue-on-error: true
        run: npm run sonar:scan -- -Dsonar.token="$SONAR_TOKEN"

      - name: Read SonarQube Quality Gate
        id: read_gate
        if: always()
        run: |
          STATUS="UNKNOWN"
          if [ -n "$SONAR_TOKEN" ]; then
            RESPONSE=$(curl -s -u "$SONAR_TOKEN:" \
              "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=master-gateway" 2>/dev/null || true)
            STATUS=$(echo "$RESPONSE" | jq -r '.projectStatus.status // "UNKNOWN"' 2>/dev/null || echo "UNKNOWN")
          fi
          echo "gate_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "SonarQube Community Quality Gate: $STATUS"

      - name: Notify SonarQube Quality Gate
        if: always()
        continue-on-error: true
        uses: appleboy/telegram-action@4cd2253b24c9682a5be99eb6f7ab3484586978fa
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            SonarQube Community - Quality Gate: ${{ steps.read_gate.outputs.gate_status }}

            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Enforce SonarQube Quality Gate
        if: always()
        run: |
          ANALYSIS="${{ steps.sonar_analysis.outcome }}"
          GATE="${{ steps.read_gate.outputs.gate_status }}"
          echo "SonarQube analysis outcome: $ANALYSIS"
          echo "Quality Gate status: $GATE"
          if [ "$ANALYSIS" != "success" ]; then
            echo "::error::SonarQube analysis failed or did not complete: $ANALYSIS"
            exit 1
          fi
          if [ "$GATE" != "OK" ]; then
            echo "::error::SonarQube Community Quality Gate must be OK, got: $GATE"
            exit 1
          fi
          echo "Quality Gate passed!"
      - name: Stop SonarQube
        if: always()
        run: docker compose down sonar-db sonarqube

  # ──────────────────────────────────────────────────────────────
  # ESTRATEGIA 1+2+3+4: CodeBERT SAST condicional
  #
  # ESTRATEGIA 4 (branch): En dev NUNCA corre. En test/PR corre si hay cambios de codigo.
  # En main corre despues de SonarQube OK y es obligatorio para deploy.
  #
  # ESTRATEGIA 1 (fast-path): Se salta si no hay cambios de código
  #
  # ESTRATEGIA 3 (hash cache): Se salta si el hash de archivos
  #   fuente no cambió desde la última ejecución exitosa
  # ──────────────────────────────────────────────────────────────
  codebert-sast:
    needs: [build-test, detect-changes, sonarqube]
    # Dev no ejecuta SAST. Test/PR lo ejecutan solo con cambios de codigo.
    # Main lo ejecuta siempre despues de SonarQube OK porque bloquea deploy.
    if: |
      always() &&
      needs.build-test.result == 'success' &&
      (
        ((github.event_name == 'pull_request' || github.ref == 'refs/heads/test') && needs.detect-changes.outputs.has_code == 'true') ||
        (github.ref == 'refs/heads/main' && needs.sonarqube.result == 'success' && needs.sonarqube.outputs.gate_status == 'OK')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CODEBERT_MODEL: mahdin70/CodeBERT-PrimeVul-BigVul
      CODEBERT_THRESHOLD: "0.999"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Hugging Face cache
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: codebert-hf-${{ runner.os }}-${{ hashFiles('security/codebert-sast/requirements.txt') }}
          restore-keys: |
            codebert-hf-${{ runner.os }}-

      # ESTRATEGIA 3: Hash de archivos fuente como cache key
      - name: Compute source hash
        id: source_hash
        shell: bash
        run: |
          HASH=$(find backend/src frontend-vue/src services -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.vue' -o -name '*.js' -o -name '*.jsx' \) 2>/dev/null | sort | xargs md5sum 2>/dev/null | md5sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Source files hash: $HASH"

      - name: Restore SAST results cache
        id: sast_cache
        uses: actions/cache@v4
        with:
          path: reports/codebert-sast-cache.json
          key: sast-result-${{ steps.source_hash.outputs.hash }}

      - name: Prepare changed files
        if: steps.sast_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p reports .cache/huggingface
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > reports/codebert-changed-files-all.txt
            grep -E '\.(c|cc|cpp|cxx|h|hpp|java|js|jsx|py|rs|ts|tsx)$' reports/codebert-changed-files-all.txt | grep -v '^scripts/' > reports/codebert-changed-files.txt || true
          else
            find backend/src frontend/src frontend-vue/src services -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' -o -name '*.vue' -o -name '*.py' -o -name '*.java' -o -name '*.c' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.rs' \) > reports/codebert-changed-files.txt
          fi
          cat reports/codebert-changed-files.txt

      - name: Build CodeBERT SAST image
        if: steps.sast_cache.outputs.cache-hit != 'true'
        run: docker build -f security/codebert-sast/Dockerfile -t master-gateway-codebert-sast .

      - name: Run CodeBERT SAST gate
        if: steps.sast_cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -v "$PWD/.cache/huggingface:/cache/huggingface" \
            -e HF_HOME=/cache/huggingface \
            -e CODEBERT_MODEL="$CODEBERT_MODEL" \
            -e CODEBERT_THRESHOLD="$CODEBERT_THRESHOLD" \
            master-gateway-codebert-sast \
            --changed-files reports/codebert-changed-files.txt \
            --report reports/codebert-sast.json

      # Guardar resultado en cache para futuras ejecuciones con mismo hash
      - name: Cache SAST result
        if: steps.sast_cache.outputs.cache-hit != 'true' && always()
        shell: bash
        run: |
          if [ -f reports/codebert-sast.json ]; then
            cp reports/codebert-sast.json reports/codebert-sast-cache.json
          fi

      - name: Restore cached result if hit
        if: steps.sast_cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          echo "SAST result cache hit! Hash: ${{ steps.source_hash.outputs.hash }}"
          cp reports/codebert-sast-cache.json reports/codebert-sast.json 2>/dev/null || true

      - name: Upload CodeBERT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codebert-sast-report
          path: |
            reports/codebert-sast.json
            reports/codebert-changed-files.txt

      - name: Parse SAST Report for Telegram
        if: failure()
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          {
            echo "COMMIT_MSG<<EOF"
            echo "$COMMIT_MSG"
            echo "EOF"
          } >> "$GITHUB_ENV"

          if [ -f reports/codebert-sast.json ]; then
            VULN_DETAILS=$(jq -r '.files[] | select(.status == "VULNERABLE") | "- Archivo: \(.path)\n  Reglas:\n\(.rules[] | "    * \(.rule_id) (\(.severity)): \(.message)")\n"' reports/codebert-sast.json | head -c 3000)
            if [ -z "$VULN_DETAILS" ]; then
              VULN_DETAILS="No se pudo extraer el detalle de las vulnerabilidades."
            fi
          else
            VULN_DETAILS="Reporte JSON no encontrado."
          fi
          {
            echo "VULN_DETAILS<<EOF"
            echo "$VULN_DETAILS"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Alert Telegram on SAST vulnerability
        if: failure()
        uses: appleboy/telegram-action@4cd2253b24c9682a5be99eb6f7ab3484586978fa
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ⚠️ *ALERTA SAST/ML - Master Gateway*

            CodeBERT detectó patrones de código vulnerable. El pipeline ha sido BLOQUEADO.

            *Autor:* ${{ github.actor }}
            *Rama:* ${{ github.ref_name }}
            *Commit:* ${{ github.sha }}
            *Mensaje:* ${{ env.COMMIT_MSG }}

            *Vulnerabilidades Detectadas:*
            ```
            ${{ env.VULN_DETAILS }}
            ```

            Revisa el reporte completo en:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ──────────────────────────────────────────────────────────────
  # Notificaciones (adaptadas a la nueva estructura)
  # ──────────────────────────────────────────────────────────────
  telegram-notify-main-start:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram main pipeline start
        continue-on-error: true
        uses: appleboy/telegram-action@4cd2253b24c9682a5be99eb6f7ab3484586978fa
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            Master Gateway - inicio pipeline main

            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  telegram-notify-dev:
    if: |
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/dev' &&
      needs.build-test.result != 'cancelled'
    needs:
      - build-test
      - detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        uses: appleboy/telegram-action@4cd2253b24c9682a5be99eb6f7ab3484586978fa
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            Master Gateway - push a dev (fast-path)

            Build/Test: ${{ needs.build-test.result }}
            Código detectado: ${{ needs.detect-changes.outputs.has_code }}
            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}

            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  telegram-notify-test:
    if: |
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/test' &&
      needs.build-test.result != 'cancelled'
    needs:
      - build-test
      - detect-changes
      - codebert-sast
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        uses: appleboy/telegram-action@4cd2253b24c9682a5be99eb6f7ab3484586978fa
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            Master Gateway - push a test

            Build/Test: ${{ needs.build-test.result }}
            CodeBERT SAST: ${{ needs.codebert-sast.result }}
            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}

            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  telegram-notify-main:
    if: |
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.build-test.result != 'cancelled'
    needs:
      - build-test
      - detect-changes
      - sonarqube
      - codebert-sast
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        uses: appleboy/telegram-action@4cd2253b24c9682a5be99eb6f7ab3484586978fa
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            Master Gateway - main (rigor completo)

            Build/Test: ${{ needs.build-test.result }}
            SonarQube: ${{ needs.sonarqube.result }} (gate: ${{ needs.sonarqube.outputs.gate_status }})
            CodeBERT SAST: ${{ needs.codebert-sast.result }}
            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}

            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  telegram-notify-pr:
    if: always() && github.event_name == 'pull_request'
    needs:
      - build-test
      - detect-changes
      - codebert-sast
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        uses: appleboy/telegram-action@4cd2253b24c9682a5be99eb6f7ab3484586978fa
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            Master Gateway - PR #${{ github.event.pull_request.number }}

            Build/Test: ${{ needs.build-test.result }}
            CodeBERT SAST: ${{ needs.codebert-sast.result }}
            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}

            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ──────────────────────────────────────────────────────────────
  # Deploy (solo main, requiere SonarQube OK y SAST OK)
  # ──────────────────────────────────────────────────────────────
  deploy:
    # Solo main. Requiere build/test, SonarQube Quality Gate OK y SAST aprobado.
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build-test.result == 'success' &&
      needs.sonarqube.result == 'success' &&
      needs.sonarqube.outputs.gate_status == 'OK' &&
      needs.codebert-sast.result == 'success'
    needs:
      - build-test
      - detect-changes
      - sonarqube
      - codebert-sast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Render CLI
        run: |
          archive=cli_2.19.0_linux_amd64.zip
          curl -fsSLO "https://github.com/render-oss/cli/releases/download/v2.19.0/$archive"
          unzip -oq "$archive"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 cli_v2.19.0 "$HOME/.local/bin/render"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Render backend service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: bash scripts/configure-render-service.sh

      - name: Configure Render database and environment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DATABASE_ID: ${{ secrets.RENDER_DATABASE_ID }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
          JWE_SECRET: ${{ secrets.JWE_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TEMP_JWT_SECRET: ${{ secrets.TEMP_JWT_SECRET }}
          REFRESH_JWT_SECRET: ${{ secrets.REFRESH_JWT_SECRET }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          OPA_URL: ${{ vars.OPA_URL }}
          SEED_ADMIN_EMAIL: ${{ vars.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: bash scripts/configure-render-environment.sh

      - name: Deploy to Render via CLI
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          render deploys create "$RENDER_SERVICE_ID" \
            --output json \
            --confirm \
            --wait \
            --commit "$GITHUB_SHA"

      - name: Notify deploy result
        if: always()
        uses: appleboy/telegram-action@4cd2253b24c9682a5be99eb6f7ab3484586978fa
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            Master Gateway - Despliegue en Render terminado.

            Resultado: ${{ job.status }}
            Commit: ${{ github.sha }}
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
