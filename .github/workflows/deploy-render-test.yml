name: Deploy Render Test

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to deploy
        required: true
        type: string
      confirm:
        description: Bypass security gates for this temporary deploy test
        required: true
        default: false
        type: boolean

jobs:
  deploy-only:
    if: github.ref == 'refs/heads/agent/sincroniza-dev-test' && inputs.confirm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Configure Render backend service
        id: render_config
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: bash scripts/configure-render-service.sh

      - name: Install Render CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/render-oss/cli/main/bin/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Deploy exact commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: |
          render deploys create "$RENDER_SERVICE_ID" \
            --output json \
            --confirm \
            --wait \
            --commit "$TARGET_SHA"

      - name: Verify Render health
        env:
          SERVICE_URL: ${{ steps.render_config.outputs.service_url }}
        run: |
          test -n "$SERVICE_URL"
          curl --fail --show-error --silent \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            "$SERVICE_URL/api/health"
