sonar.projectKey=master-gateway
sonar.projectName=Master Gateway
sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000

# `frontend/` era el Angular legado, ya retirado del repositorio, y
# `services/ventas` vive fuera de este repo (esta en .gitignore). Apuntar Sonar
# ahi significaba que el Quality Gate -el que bloquea el despliegue- analizaba
# rutas inexistentes y NO analizaba el frontend real (`frontend-vue`).
sonar.sources=backend/src,frontend-vue/src
sonar.tests=backend/src,backend/test
sonar.test.inclusions=backend/src/**/*.spec.ts,backend/test/**/*.ts

# security/fixtures contiene codigo vulnerable a proposito para probar el agente SAST.
# Debe quedar fuera de Sonar igual que queda fuera del escaneo por defecto de CodeBERT.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,backend/prisma/migrations/**,security/fixtures/**
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
