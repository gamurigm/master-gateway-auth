# Postura Zero Trust a nivel de red: por defecto se niega todo el tráfico de
# entrada dentro del namespace y se abren sólo los flujos necesarios.
# (Requiere un CNI que soporte NetworkPolicy; con el CNI por defecto de minikube
#  puede no aplicarse, pero queda declarado como política deseada.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-backend
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    # Sólo frontend, ventas y los Jobs pueden hablar con el Master.
    - from:
        - podSelector:
            matchLabels:
              app: frontend
        - podSelector:
            matchLabels:
              app: ventas
        - podSelector:
            matchLabels:
              app: db-migrate
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-postgres
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    # Sólo el backend y el Job de migración acceden a la base de datos.
    - from:
        - podSelector:
            matchLabels:
              app: backend
        - podSelector:
            matchLabels:
              app: db-migrate
      ports:
        - protocol: TCP
          port: 5432
