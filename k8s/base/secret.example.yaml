# PLANTILLA de ejemplo. NO contiene secretos reales y NO debe aplicarse tal cual
# en producción. Los overlays generan el Secret real con valores propios (ver
# k8s/overlays/dev/kustomization.yaml y el README).
#
# Para crear uno manualmente:
#   kubectl create secret generic master-gateway-secrets -n master-gateway \
#     --from-literal=JWT_SECRET=$(openssl rand -base64 24) \
#     --from-literal=JWE_SECRET=$(openssl rand -base64 24 | cut -c1-32) \
#     ...
#
# JWE_SECRET debe medir EXACTAMENTE 32 bytes (lo valida env.validation.ts).
apiVersion: v1
kind: Secret
metadata:
  name: master-gateway-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REEMPLAZAR"
  DATABASE_URL: "postgresql://postgres:REEMPLAZAR@postgres:5432/master_gateway?schema=public"
  JWT_SECRET: "REEMPLAZAR"
  JWE_SECRET: "REEMPLAZAR-32-bytes-exactos-xxxx"
  TEMP_JWT_SECRET: "REEMPLAZAR"
  REFRESH_JWT_SECRET: "REEMPLAZAR"
  # Debe coincidir con el que use ventas (MASTER_INTERNAL_API_KEY).
  INTERNAL_API_KEY: "REEMPLAZAR"
  MASTER_INTERNAL_API_KEY: "REEMPLAZAR"
  SEED_ADMIN_EMAIL: "admin@example.com"
  SEED_ADMIN_PASSWORD: "REEMPLAZAR"
