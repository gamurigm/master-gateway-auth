services:
  postgres:
    image: postgres:16-alpine
    container_name: master-gateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: master_gateway
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d master_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5

  kong-db:
    image: postgres:16-alpine
    container_name: kong-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong
    ports:
      - "5443:5432"
    volumes:
      - kong-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  kong-migrations:
    image: kong:3.8
    container_name: kong-migrations
    depends_on:
      kong-db:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
    command: kong migrations bootstrap

  kong:
    image: kong:3.8
    container_name: kong-api-gateway
    restart: unless-stopped
    depends_on:
      kong-db:
        condition: service_healthy
      kong-migrations:
        condition: service_completed_successfully
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    ports:
      - "8000:8000"   # Kong Proxy
      - "8443:8443"   # Kong Proxy HTTPS
      - "8001:8001"   # Kong Admin API
      - "8444:8444"   # Kong Admin API HTTPS
    healthcheck:
      test: ["CMD-SHELL", "kong health"]
      interval: 10s
      timeout: 10s
      retries: 10

  konga:
    image: pantsel/konga:latest
    container_name: konga
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_ADAPTER: postgres
      DB_HOST: kong-db
      DB_PORT: 5432
      DB_USER: kong
      DB_PASSWORD: kong
      DB_DATABASE: kong
      KONGA_HOOK_TIMEOUT: 120000
    ports:
      - "1337:1337"   # Konga UI

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: master-gateway-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/master_gateway?schema=public
      FRONTEND_ORIGIN: http://localhost:4200
      JWT_ISSUER: master-gateway
      JWT_AUDIENCE: master-gateway-clients
      JWT_EXPIRES_IN: 15m
      TEMP_JWT_EXPIRES_IN: 5m
      REFRESH_JWT_EXPIRES_IN: 7d
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-docker-internal-key}
      INTERNAL_ALLOWED_SERVICES: ventas
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin12345!}
    volumes:
      - ./backend/keys:/app/keys:ro
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  register-backend:
    image: node:24.15.0-bookworm-slim
    container_name: master-gateway-register-backend
    depends_on:
      kong:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
    working_dir: /scripts
    environment:
      KONG_ADMIN_URL: http://kong:8001
      KONG_SERVICE_NAME: master-gateway
      KONG_SERVICE_URL: http://backend:3000
      KONG_ROUTE_PATHS: /api
      KONG_WAIT_TIME: 15
    command: ["node", "auto-register-kong.js"]
    restart: "no"  # Solo se ejecuta una vez

  frontend-vue:
    build:
      context: .
      dockerfile: frontend-vue/Dockerfile
    container_name: master-gateway-frontend-vue
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_VUE_PORT:-4201}:80"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: master-gateway-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:80"

  ventas:
    build:
      context: .
      dockerfile: services/ventas/Dockerfile
    container_name: master-gateway-ventas
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VENTAS_PORT: 3006
      MASTER_VALIDATE_URL: http://backend:3000/api/internals/validate-token
      # Debe coincidir con INTERNAL_API_KEY del backend: es la misma credencial
      # compartida que autentica al microservicio hijo contra el Master.
      MASTER_INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-docker-internal-key}
      MASTER_INTERNAL_SERVICE_NAME: ventas
      VENTAS_ALLOWED_ROLES: ADMIN,VENTAS
      MASTER_VALIDATE_RETRY_ATTEMPTS: 3
      MASTER_VALIDATE_RETRY_DELAY_MS: 500
    ports:
      - "${VENTAS_PORT:-3006}:3006"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3006/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  register-ventas:
    image: node:24.15.0-bookworm-slim
    container_name: master-gateway-register-ventas
    depends_on:
      kong:
        condition: service_healthy
      ventas:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
    working_dir: /scripts
    environment:
      KONG_ADMIN_URL: http://kong:8001
      KONG_SERVICE_NAME: ventas-service
      KONG_SERVICE_URL: http://ventas:3006
      KONG_ROUTE_PATHS: /ventas,/health
      KONG_WAIT_TIME: 15
    command: ["node", "auto-register-kong.js"]
    restart: "no"  # Solo se ejecuta una vez

  sonar-db:
    image: postgres:16-alpine
    container_name: master-gateway-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar-postgresql:/var/lib/postgresql
      - sonar-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:community
    container_name: master-gateway-sonarqube
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs

  codebert-sast:
    profiles:
      - security
    build:
      context: .
      dockerfile: security/codebert-sast/Dockerfile
    image: master-gateway-codebert-sast:local
    working_dir: /workspace
    environment:
      CODEBERT_MODEL: ${CODEBERT_MODEL:-mahdin70/CodeBERT-PrimeVul-BigVul}
      CODEBERT_THRESHOLD: ${CODEBERT_THRESHOLD:-0.999}
      HF_HOME: /cache/huggingface
      TRANSFORMERS_CACHE: /cache/huggingface
    volumes:
      - .:/workspace
      - codebert-cache:/cache/huggingface
    command:
      - --path
      - backend/src
      - --path
      - frontend/src
      - --path
      - services
      - --report
      - reports/codebert-sast.json

volumes:
  postgres-data:
  kong-postgres-data:
  sonar-postgresql:
  sonar-postgresql-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  codebert-cache:
