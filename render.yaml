services:
  - type: web
    name: master-gateway
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TEMP_JWT_SECRET
        sync: false
      - key: REFRESH_JWT_SECRET
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: JWE_SECRET
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
