apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: master-gateway
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: master-gateway.local
      http:
        paths:
          # El frontend (nginx) ya proxya /api hacia el Service backend, así que
          # una sola regla hacia el frontend cubre SPA + API.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
