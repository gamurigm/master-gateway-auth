name: Deploy Render Test

on:
  push:
    branches:
      - deploy/render-test

jobs:
  deploy-only:
    if: github.ref == 'refs/heads/deploy/render-test'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4

      - name: Configure Render backend service
        id: render_config
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: bash scripts/configure-render-service.sh

      - name: Configure Render database and environment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DATABASE_ID: ${{ secrets.RENDER_DATABASE_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TEMP_JWT_SECRET: ${{ secrets.TEMP_JWT_SECRET }}
          REFRESH_JWT_SECRET: ${{ secrets.REFRESH_JWT_SECRET }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          SEED_ADMIN_EMAIL: ${{ vars.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: bash scripts/configure-render-environment.sh

      - name: Install Render CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/render-oss/cli/main/bin/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Deploy exact commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          render deploys create "$RENDER_SERVICE_ID" \
            --output json \
            --confirm \
            --wait \
            --commit "$TARGET_SHA"

      - name: Verify Render health
        env:
          SERVICE_URL: ${{ steps.render_config.outputs.service_url }}
        run: |
          test -n "$SERVICE_URL"
          curl --fail --show-error --silent \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            "$SERVICE_URL/api/health"
