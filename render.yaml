services:
  - type: web
    name: master-gateway
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: JWT_ISSUER
        value: master-gateway
      - key: JWT_AUDIENCE
        value: master-gateway-clients
      - key: INTERNAL_API_KEY
        sync: false
      - key: INTERNAL_ALLOWED_SERVICES
        value: ventas
      - key: SEED_ADMIN_EMAIL
        value: admin@example.com
      - key: SEED_ADMIN_PASSWORD
        sync: false
