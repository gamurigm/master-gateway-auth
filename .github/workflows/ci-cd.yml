name: CI/CD

on:
  pull_request:
    branches:
      - dev
      - test
      - main
  push:
    branches:
      - dev
      - test
      - main

# Minimo privilegio para GITHUB_TOKEN: ningun job necesita escribir en el repo.
# Sin este bloque el token hereda los permisos por defecto de la organizacion,
# que suelen incluir escritura.
permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hace verificable la estrategia feature -> dev -> test -> main del PDF.
  # Este check debe marcarse como obligatorio en las reglas de proteccion.
  branch-flow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch promotion path
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          case "$BASE_BRANCH" in
            main)
              [ "$HEAD_BRANCH" = "test" ] || {
                echo "::error::main solo acepta Pull Requests desde test."
                exit 1
              }
              ;;
            test)
              [ "$HEAD_BRANCH" = "dev" ] || {
                echo "::error::test solo acepta Pull Requests desde dev."
                exit 1
              }
              ;;
            dev)
              case "$HEAD_BRANCH" in
                main|test|dev)
                  echo "::error::dev solo acepta ramas de trabajo, no ramas protegidas."
                  exit 1
                  ;;
              esac
              ;;
          esac
  # ──────────────────────────────────────────────────────────────
  # Notificación de INICIO del pipeline en main.
  # Exigida explícitamente por el anexo del proyecto ("Inicio del Pipeline
  # en main"). Va primero y sin needs para que llegue de inmediato.
  # ──────────────────────────────────────────────────────────────
  telegram-notify-start:
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Notify pipeline start
        uses: appleboy/telegram-action@4cd2253b24c9682a5be99eb6f7ab3484586978fa
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            🚀 <b>Pipeline iniciado (${{ github.ref_name }}) - Master Gateway</b>

            <b>Autor:</b> ${{ github.actor }}
            <b>Commit:</b> <code>${{ github.sha }}</code>

            Fases: Build y Tests → SonarQube Quality Gate → SAST CodeBERT (CWE / OWASP 2025) → Despliegue en Render.

            Seguimiento:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ──────────────────────────────────────────────────────────────
  # Self-test del agente SAST: valida que las reglas CWE siguen
  # detectando los fixtures vulnerables y no marcan los seguros.
  # Solo motor de reglas: no descarga los pesos del modelo (segundos).
  # ──────────────────────────────────────────────────────────────
  codebert-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run SAST agent self-test
        run: python security/codebert-sast/selftest.py

      - name: Scan vulnerable fixtures (must exit 1)
        run: |
          set +e
          python security/codebert-sast/codebert_sast.py \
            --rules-only --include-fixtures \
            --path security/fixtures/vulnerable \
            --report reports/codebert-fixtures.json \
            --markdown-report reports/codebert-fixtures.md
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 1 ]; then
            echo "::error::El agente debia salir con codigo 1 sobre los fixtures vulnerables, salio $STATUS"
            exit 1
          fi
          echo "El agente bloquea correctamente el codigo vulnerable (exit 1)."

      - name: Upload fixture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codebert-selftest-report
          path: |
            reports/codebert-fixtures.json
            reports/codebert-fixtures.md

  # ──────────────────────────────────────────────────────────────
  # ESTRATEGIA 1: Detectar si hay cambios en código fuente
  # Permite fast-path para commits de docs/config
  # ──────────────────────────────────────────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      has_code: ${{ steps.filter.outputs.has_code }}
      has_security_relevant: ${{ steps.filter.outputs.has_security_relevant }}
      services_matrix: ${{ steps.services.outputs.matrix }}
      has_services: ${{ steps.services.outputs.has_services }}
      new_services_matrix: ${{ steps.services.outputs.new_matrix }}
      has_new_services: ${{ steps.services.outputs.has_new_services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
        id: filter
        with:
          filters: |
            has_code:
              - 'backend/src/**/*.ts'
              - 'frontend-vue/src/**/*.ts'
              - 'frontend-vue/src/**/*.vue'
              - 'services/**/*.ts'
              - 'services/**/*.js'
              - 'services/**/*.json'
            has_security_relevant:
              - 'backend/src/**/*.ts'
              - 'frontend-vue/src/**/*.ts'
              - 'frontend-vue/src/**/*.vue'
              - 'services/**/*.ts'
              - 'services/**/*.js'
              - 'backend/prisma/schema.prisma'
              - 'security/**'
              - '.github/workflows/ci-cd.yml'
              - 'sonar-project.properties'

      # Detecta automáticamente qué servicios cambiaron y genera una matriz dinámica
      - name: Detect changed services
        id: services
        shell: bash
        run: |
          # Encontrar todos los directorios de servicios
          shopt -s nullglob
          SERVICES=()
          for dir in services/*/; do
            name=$(basename "$dir")
            SERVICES+=("$name")
          done

          # Detectar cambios en servicios (PR vs push)
          CHANGED=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -oP '^services/\K[^/]+' | sort -u || true)
          else
            CHANGED=$(git diff --name-only "origin/${{ github.sha }}^1...${{ github.sha }}" 2>/dev/null | grep -oP '^services/\K[^/]+' | sort -u || true)
            # En primera ejecución sin historial, incluir todos
            if [ -z "$CHANGED" ]; then
              CHANGED=$(printf '%s\n' "${SERVICES[@]}")
            fi
          fi

          # Construir matriz solo con servicios que existen y cambiaron (o todos si no hay cambios detectados)
          MATRIX="{\"include\":["
          FIRST=true
          for svc in $(echo "$CHANGED" | sort -u); do
            if [ -d "services/$svc" ]; then
              if [ "$FIRST" = true ]; then
                FIRST=false
              else
                MATRIX="$MATRIX,"
              fi
              MATRIX="$MATRIX{\"service\":\"$svc\"}"
            fi
          done
          MATRIX="$MATRIX]}"

          # Si no hay servicios identificados, incluir todos los que existen
          if [ "$MATRIX" = '{"include":[]}' ]; then
            FIRST=true
            MATRIX="{\"include\":["
            for svc in "${SERVICES[@]}"; do
              if [ "$FIRST" = true ]; then
                FIRST=false
              else
                MATRIX="$MATRIX,"
              fi
              MATRIX="$MATRIX{\"service\":\"$svc\"}"
            done
            MATRIX="$MATRIX]}"
          fi

          HAS_SERVICES="false"
          if [ "$MATRIX" != '{"include":[]}' ]; then
            HAS_SERVICES="true"
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "has_services=$HAS_SERVICES" >> "$GITHUB_OUTPUT"
          echo "Detected services matrix: $MATRIX"

          # Detectar servicios NUEVOS (no existían en la rama base)
          NEW_MATRIX='{"include":[]}'
          HAS_NEW="false"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1 2>/dev/null || true
            MAIN_SERVICES=$(git ls-tree -d --name-only "origin/${{ github.base_ref }}" services/ 2>/dev/null | sed 's|services/||' || true)
            NEW_NAMES=()
            for svc in "${SERVICES[@]}"; do
              if ! echo "$MAIN_SERVICES" | grep -qx "$svc"; then
                NEW_NAMES+=("$svc")
              fi
            done
            if [ ${#NEW_NAMES[@]} -gt 0 ]; then
              HAS_NEW="true"
              NEW_MATRIX='{"include":['
              FIRST=true
              for svc in "${NEW_NAMES[@]}"; do
                if [ "$FIRST" = true ]; then FIRST=false; else NEW_MATRIX="$NEW_MATRIX,"; fi
                NEW_MATRIX="$NEW_MATRIX{\"service\":\"$svc\"}"
              done
              NEW_MATRIX="$NEW_MATRIX]}"
            fi
          fi

          echo "new_matrix=$NEW_MATRIX" >> "$GITHUB_OUTPUT"
          echo "has_new_services=$HAS_NEW" >> "$GITHUB_OUTPUT"
          echo "New services matrix: $NEW_MATRIX"

  # ──────────────────────────────────────────────────────────────
  # Build + Tests (siempre corre, es la base de todo)
  # ──────────────────────────────────────────────────────────────
  build-test:
    needs: detect-changes
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/master_gateway?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate --schema backend/prisma/schema.prisma

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Backend build
        run: npm run build:backend

      - name: Backend unit tests
        run: npm run test -w backend -- --runInBand

      - name: Backend e2e tests
        run: npm run test:e2e -w backend -- --runInBand

      - name: Frontend build
        run: npm run build:frontend

  # ──────────────────────────────────────────────────────────────
  # Build dinámico de microservicios (matriz auto-detectada)
  # Si aparece un nuevo directorio en services/, se detecta solo.
  # ──────────────────────────────────────────────────────────────
  services-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_services == 'true' && needs.detect-changes.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.detect-changes.outputs.services_matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build ${{ matrix.service }}
        run: |
          if [ -f "services/${{ matrix.service }}/package.json" ]; then
            cd "services/${{ matrix.service }}"
            if grep -q '"build"' package.json; then
              npm run build
            fi
            if grep -q '"test"' package.json; then
              npm test
            fi
          else
            echo "No package.json found for ${{ matrix.service }} - skipping"
          fi

      - name: Docker build ${{ matrix.service }}
        run: |
          if [ -f "services/${{ matrix.service }}/Dockerfile" ]; then
            docker build -t "master-gateway-${{ matrix.service }}:ci" \
              -f "services/${{ matrix.service }}/Dockerfile" \
              "services/${{ matrix.service }}"
            echo "Docker image built: master-gateway-${{ matrix.service }}:ci"
          else
            echo "No Dockerfile for ${{ matrix.service }} - skipping"
          fi

  # ──────────────────────────────────────────────────────────────
  # Security scan para servicios NUEVOS (no existían en main).
  # Corre trivy (image + fs) + sonar análisis para cada nuevo servicio.
  # ──────────────────────────────────────────────────────────────
  services-security:
    needs: [detect-changes, services-build]
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.has_new_services == 'true' &&
      (needs.services-build.result == 'success' || needs.services-build.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.detect-changes.outputs.new_services_matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run trivy filesystem scan on ${{ matrix.service }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: services/${{ matrix.service }}
          format: sarif
          output: reports/trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH

      - name: Upload trivy SARIF for ${{ matrix.service }}
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Sonar analysis for ${{ matrix.service }}
        run: |
          npm run sonar:scan -- \
            -Dsonar.sources="services/${{ matrix.service }}/src" \
            -Dsonar.projectName="Master Gateway - ${{ matrix.service }}" \
            -Dsonar.projectKey="master-gateway-${{ matrix.service }}" \
            -Dsonar.exclusions="**/node_modules/**,**/dist/**,**/coverage/**"

  # ──────────────────────────────────────────────────────────────
  # ESTRATEGIA 2 + 4: SonarQube corre ANTES de CodeBERT en main
  # y produce gate_status como output para el filtro condicional
  # ──────────────────────────────────────────────────────────────
  sonarqube:
    name: sonarqube-community
    # ESTRATEGIA 4: Solo en push a main (rigor máximo)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      gate_status: ${{ steps.read_gate.outputs.gate_status }}
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/master_gateway?schema=public
      SONAR_HOST_URL: http://localhost:9000
      # docker compose interpola TODO el archivo antes de decidir qué servicios
      # levantar, así que aunque este job sólo arranca sonar-db/sonarqube, exige
      # las variables ${...:?} del bloque backend. Estos valores son de usar y
      # tirar: los contenedores de Sonar nunca los leen. Los secretos reales
      # llegan por GitHub Secrets al job de deploy.
      #
      # IMPORTANTE: si añades un `${VAR:?}` nuevo a docker-compose.yml, tienes
      # que declararlo también aquí o este job falla al interpolar, tanto en
      # `compose up` como en `compose down`. El paso "Verify compose
      # interpolation" comprueba justo eso y falla con un mensaje claro.
      JWT_SECRET: ci-sonar-placeholder-not-used
      JWE_SECRET: ci-sonar-placeholder-32bytes-xxx
      TEMP_JWT_SECRET: ci-sonar-placeholder-not-used
      REFRESH_JWT_SECRET: ci-sonar-placeholder-not-used
      INTERNAL_API_KEY: ci-sonar-placeholder-not-used
      SEED_ADMIN_PASSWORD: ci-sonar-placeholder-not-used
      SEED_SUPER_ADMIN_PASSWORD: ci-sonar-placeholder-not-used
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Backend coverage
        run: npm run test:coverage

      # Falla rapido y con un mensaje claro si docker-compose.yml gana una
      # variable obligatoria que este job no declara. Sin esto el error aparece
      # enterrado dentro de `compose up` y ademas rompe el `compose down` del
      # paso de limpieza, dejando contenedores huerfanos.
      - name: Verify compose interpolation
        run: |
          if ! docker compose config --quiet 2>/tmp/compose-err; then
            echo "::error::docker-compose.yml no interpola con las variables de este job."
            echo "::error::Declara la variable que falta en el bloque 'env:' del job sonarqube."
            cat /tmp/compose-err
            exit 1
          fi
          echo "docker-compose.yml interpola correctamente."

      - name: Start SonarQube Community
        run: |
          set -euo pipefail
          docker compose up -d sonar-db sonarqube
          echo "Waiting for SonarQube to be ready..."
          STATUS="DOWN"
          for i in $(seq 1 60); do
            STATUS=$(curl -s -f "http://localhost:9000/api/system/status" 2>/dev/null | jq -r '.status' 2>/dev/null || echo "DOWN")
            if [ "$STATUS" = "UP" ]; then
              echo "SonarQube is ready!"
              break
            fi
            echo "Attempt $i: status=$STATUS, waiting 10s..."
            sleep 10
          done
          if [ "$STATUS" != "UP" ]; then
            echo "::error::SonarQube Community did not become ready"
            docker compose logs --no-color --tail=100 sonar-db sonarqube
            exit 1
          fi

      - name: Generate SonarQube token
        run: |
          TOKEN=$(curl -s -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate" \
            -d "name=ci-$(date +%s)" | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to generate SonarQube token"
            docker compose logs sonarqube --tail=20
            exit 1
          fi
          echo "SONAR_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: SonarQube analysis
        id: sonar_analysis
        run: npm run sonar:scan -- -Dsonar.token="$SONAR_TOKEN"

      - name: Read SonarQube Quality Gate
        id: read_gate
        if: always()
        run: |
          STATUS="UNKNOWN"
          if [ -n "$SONAR_TOKEN" ]; then
            RESPONSE=$(curl -s -u "$SONAR_TOKEN:" \
              "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=master-gateway" 2>/dev/null || true)
            STATUS=$(echo "$RESPONSE" | jq -r '.projectStatus.status // "UNKNOWN"' 2>/dev/null || echo "UNKNOWN")
          fi
          echo "gate_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "SonarQube Community Quality Gate: $STATUS"

      - name: Notify SonarQube Quality Gate
        if: always()
        continue-on-error: true
        uses: appleboy/telegram-action@4cd2253b24c9682a5be99eb6f7ab3484586978fa
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            SonarQube Community - Quality Gate: ${{ steps.read_gate.outputs.gate_status }}

            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Enforce SonarQube Quality Gate
        if: always()
        run: |
          GATE="${{ steps.read_gate.outputs.gate_status }}"
          echo "Quality Gate status: $GATE"
          if [ "${{ steps.sonar_analysis.outcome }}" != "success" ]; then
            echo "::error::SonarQube analysis failed; deployment is blocked."
            exit 1
          fi
          if [ "$GATE" != "OK" ]; then
            echo "::error::SonarQube Community Quality Gate did not pass: $GATE"
            exit 1
          fi
          echo "Quality Gate passed!"

      - name: Stop SonarQube
        if: always()
        run: docker compose down sonar-db sonarqube

  # ──────────────────────────────────────────────────────────────
  # ESTRATEGIA 1+2+3+4: CodeBERT SAST condicional
  #
  # ESTRATEGIA 4 (branch): En dev NUNCA corre. En test corre si
  #   hay cambios de código. En main corre solo si el gate de
  #   SonarQube NO es OK (estrategia 2).
  #
  # ESTRATEGIA 1 (fast-path): Se salta si no hay cambios de código
  #
  # ESTRATEGIA 3 (hash cache): Se salta si el hash de archivos
  #   fuente no cambió desde la última ejecución exitosa
  # ──────────────────────────────────────────────────────────────
  codebert-sast:
    needs: [build-test, detect-changes, sonarqube, codebert-selftest]
    # ESTRATEGIA 1: Solo ejecutar si hay código fuente changed
    # ESTRATEGIA 4: En dev nunca. En test siempre. En main solo si el gate paso.
    # El self-test debe pasar primero: si el agente no detecta sus propios
    # fixtures vulnerables, su veredicto sobre el código real no vale nada.
    if: |
      always() &&
      needs.build-test.result == 'success' &&
      needs.codebert-selftest.result == 'success' &&
      needs.detect-changes.outputs.has_security_relevant == 'true' &&
      (
        (github.event_name == 'pull_request') ||
        (github.ref == 'refs/heads/test') ||
        (github.ref == 'refs/heads/main' && needs.sonarqube.result == 'success' && needs.sonarqube.outputs.gate_status == 'OK')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CODEBERT_MODEL: mahdin70/CodeBERT-PrimeVul-BigVul
      # 0.85 es el umbral documentado en docs/ci-cd.md. El valor anterior (0.999)
      # dejaba la mitad ML del agente practicamente inerte.
      CODEBERT_THRESHOLD: "0.85"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Hugging Face cache
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: codebert-hf-${{ runner.os }}-${{ hashFiles('security/codebert-sast/requirements.txt') }}
          restore-keys: |
            codebert-hf-${{ runner.os }}-

      # ESTRATEGIA 3: Hash de archivos fuente como cache key
      - name: Compute source hash
        id: source_hash
        shell: bash
        run: |
          # Solo se pasan a `find` las rutas que existen. `find` sale con codigo
          # 1 si alguna ruta no existe (aunque su stderr este silenciado), y con
          # `-e -o pipefail` eso tumbaba el job entero. Pasaba desde que
          # `frontend/` (Angular legado) y `services/` salieron del repositorio.
          SOURCE_PATHS=()
          for dir in backend/src frontend-vue/src services; do
            [ -d "$dir" ] && SOURCE_PATHS+=("$dir")
          done

          if [ ${#SOURCE_PATHS[@]} -eq 0 ]; then
            echo "::error::No se encontro ningun directorio de codigo fuente"
            exit 1
          fi

          echo "Directorios analizados: ${SOURCE_PATHS[*]}"
          HASH=$(find "${SOURCE_PATHS[@]}" -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' -o -name '*.vue' \) | sort | xargs md5sum | md5sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Source files hash: $HASH"

      - name: Restore SAST results cache
        id: sast_cache
        uses: actions/cache@v4
        with:
          path: reports/codebert-sast-cache.json
          key: sast-result-${{ steps.source_hash.outputs.hash }}

      - name: Prepare changed files
        if: steps.sast_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p reports .cache/huggingface
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > reports/codebert-changed-files-all.txt
            grep -E '\.(c|cc|cpp|cxx|h|hpp|java|js|jsx|py|rs|ts|tsx)$' reports/codebert-changed-files-all.txt | grep -v '^scripts/' > reports/codebert-changed-files.txt || true
          else
            # Mismo motivo que en "Compute source hash": solo rutas existentes.
            SOURCE_PATHS=()
            for dir in backend/src frontend-vue/src services; do
              [ -d "$dir" ] && SOURCE_PATHS+=("$dir")
            done
            find "${SOURCE_PATHS[@]}" -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' -o -name '*.vue' -o -name '*.py' -o -name '*.java' -o -name '*.c' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.rs' \) > reports/codebert-changed-files.txt
          fi
          cat reports/codebert-changed-files.txt

      - name: Build CodeBERT SAST image
        if: steps.sast_cache.outputs.cache-hit != 'true'
        run: docker build -f security/codebert-sast/Dockerfile -t master-gateway-codebert-sast .

      - name: Run CodeBERT SAST gate
        if: steps.sast_cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -v "$PWD/.cache/huggingface:/cache/huggingface" \
            -e HF_HOME=/cache/huggingface \
            -e CODEBERT_MODEL="$CODEBERT_MODEL" \
            -e CODEBERT_THRESHOLD="$CODEBERT_THRESHOLD" \
            master-gateway-codebert-sast \
            --changed-files reports/codebert-changed-files.txt \
            --report reports/codebert-sast.json \
            --markdown-report reports/codebert-sast.md

      # Guardar resultado en cache para futuras ejecuciones con mismo hash
      - name: Cache SAST result
        if: steps.sast_cache.outputs.cache-hit != 'true' && always()
        shell: bash
        run: |
          if [ -f reports/codebert-sast.json ]; then
            cp reports/codebert-sast.json reports/codebert-sast-cache.json
          fi

      - name: Restore cached result if hit
        if: steps.sast_cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          echo "SAST result cache hit! Hash: ${{ steps.source_hash.outputs.hash }}"
          cp reports/codebert-sast-cache.json reports/codebert-sast.json 2>/dev/null || true

      - name: Upload CodeBERT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codebert-sast-report
          path: |
            reports/codebert-sast.json
            reports/codebert-sast.md
            reports/codebert-changed-files.txt

      - name: Parse SAST Report for Telegram
        if: failure()
        run: |
          # El mensaje se envia como HTML (parse_mode=HTML), no Markdown: el
          # codigo detectado puede contener _, *, ` y <, que rompen el parser de
          # Markdown de Telegram. En HTML basta con escapar & < >. Se recorta el
          # texto crudo ANTES de escapar para no partir una entidad a la mitad.
          html_escape() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

          COMMIT_MSG=$(git log -1 --pretty=format:"%s" | head -c 300 | html_escape)
          {
            echo "COMMIT_MSG<<EOF"
            echo "$COMMIT_MSG"
            echo "EOF"
          } >> "$GITHUB_ENV"

          if [ -f reports/codebert-sast.json ]; then
            # Resumen agregado: cuántos hallazgos, qué CWE y qué categorías OWASP 2025.
            SAST_SUMMARY=$(jq -r '
              .summary as $s
              | "Hallazgos: \($s.total_findings // 0) en \($s.vulnerable_files // 0) archivo(s)"
                + "\nCriticos: \($s.by_severity.CRITICAL // 0) | Advertencias: \($s.by_severity.WARNING // 0)"
                + "\nCWE: \(($s.by_cwe // {}) | keys | join(", "))"
                + "\nOWASP \(.owasp_version // "2025"): \(($s.by_owasp_2025 // {}) | keys | join(", "))"
            ' reports/codebert-sast.json | html_escape)

            # Detalle por hallazgo, con CWE, categoría OWASP, ubicación y CVEs.
            VULN_DETAILS=$(jq -r '
              .files[]
              | select(.status == "VULNERABLE")
              | . as $file
              | "ARCHIVO: \($file.path)  (prob. ML \($file.insecure_probability))",
                ( $file.rules[]
                  | "  [\(.severity)] \(.cwe_id) - \(.cwe_name)"
                    + "\n    Regla:     \(.rule_id)"
                    + "\n    OWASP:     \(.owasp_2025)"
                    + "\n    Ubicacion: \($file.path):\(.line)"
                    + "\n    Evidencia: \(.evidence)"
                    + "\n    CVEs ref.: \((.reference_cves // []) | if length == 0 then "-" else join(", ") end)"
                    + "\n    Remediar:  \(.remediation)"
                ),
                ""
            ' reports/codebert-sast.json | head -c 2600 | html_escape)

            if [ -z "$VULN_DETAILS" ]; then
              VULN_DETAILS="No se pudo extraer el detalle de las vulnerabilidades."
            fi
          else
            SAST_SUMMARY="Reporte JSON no encontrado."
            VULN_DETAILS="Reporte JSON no encontrado."
          fi
          {
            echo "SAST_SUMMARY<<EOF"
            echo "$SAST_SUMMARY"
            echo "EOF"
            echo "VULN_DETAILS<<EOF"
            echo "$VULN_DETAILS"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Alert Telegram on SAST vulnerability
        if: failure()
        uses: appleboy/telegram-action@4cd2253b24c9682a5be99eb6f7ab3484586978fa
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            ⚠️ <b>ALERTA SAST/ML - Master Gateway</b>

            CodeBERT detectó patrones de código vulnerable. El pipeline ha sido BLOQUEADO.

            <b>Autor:</b> ${{ github.actor }}
            <b>Rama:</b> ${{ github.ref_name }}
            <b>Commit:</b> ${{ github.sha }}
            <b>Mensaje:</b> ${{ env.COMMIT_MSG }}

            <b>Resumen:</b>
            <pre>${{ env.SAST_SUMMARY }}</pre>

            <b>Detalle (CWE / OWASP Top 10 : 2025):</b>
            <pre>${{ env.VULN_DETAILS }}</pre>

            Revisa el reporte completo en:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ──────────────────────────────────────────────────────────────
  # Check estable para las reglas de proteccion de dev/test/main.
  # Siempre termina explicitamente en success o failure en Pull Requests.
  # ──────────────────────────────────────────────────────────────
  promotion-ready:
    name: ${{ github.event_name == 'pull_request' && 'promotion-ready' || 'push-summary' }}
    if: always() && github.event_name == 'pull_request'
    needs:
      - branch-flow
      - detect-changes
      - build-test
      - services-build
      - services-security
      - codebert-selftest
      - codebert-sast
    runs-on: ubuntu-latest
    env:
      BRANCH_FLOW_RESULT: ${{ needs.branch-flow.result }}
      DETECT_CHANGES_RESULT: ${{ needs.detect-changes.result }}
      BUILD_TEST_RESULT: ${{ needs.build-test.result }}
      SERVICES_BUILD_RESULT: ${{ needs.services-build.result }}
      SERVICES_SECURITY_RESULT: ${{ needs.services-security.result }}
      CODEBERT_SELFTEST_RESULT: ${{ needs.codebert-selftest.result }}
      CODEBERT_SAST_RESULT: ${{ needs.codebert-sast.result }}
      HAS_SECURITY_RELEVANT: ${{ needs.detect-changes.outputs.has_security_relevant }}
    steps:
      - name: Enforce promotion checks
        run: |
          set -euo pipefail

          require_success() {
            local name="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::${name} termino en ${result}; promocion bloqueada."
              exit 1
            fi
          }

          allow_success_or_skipped() {
            local name="$1"
            local result="$2"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::${name} termino en ${result}; promocion bloqueada."
              exit 1
            fi
          }

          require_success "branch-flow" "$BRANCH_FLOW_RESULT"
          require_success "detect-changes" "$DETECT_CHANGES_RESULT"
          require_success "build-test" "$BUILD_TEST_RESULT"
          require_success "codebert-selftest" "$CODEBERT_SELFTEST_RESULT"
          allow_success_or_skipped "services-build" "$SERVICES_BUILD_RESULT"
          allow_success_or_skipped "services-security" "$SERVICES_SECURITY_RESULT"

          if [ "$HAS_SECURITY_RELEVANT" = "true" ]; then
            require_success "codebert-sast" "$CODEBERT_SAST_RESULT"
          else
            allow_success_or_skipped "codebert-sast" "$CODEBERT_SAST_RESULT"
          fi

          echo "Todos los controles requeridos para promocion pasaron."

  # ──────────────────────────────────────────────────────────────
  # Notificaciones (adaptadas a la nueva estructura)
  # ──────────────────────────────────────────────────────────────
  telegram-notify-dev:
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      needs.build-test.result != 'cancelled'
    needs:
      - build-test
      - detect-changes
      - codebert-selftest
      - codebert-sast
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        uses: appleboy/telegram-action@4cd2253b24c9682a5be99eb6f7ab3484586978fa
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            Master Gateway - push a ${{ github.ref_name }} (fast-path)

            Build/Test: ${{ needs.build-test.result }}
            Self-test del agente SAST: ${{ needs.codebert-selftest.result }}
            SAST CodeBERT (CWE/OWASP 2025): ${{ needs.codebert-sast.result }}
            Código detectado: ${{ needs.detect-changes.outputs.has_code }}
            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}

            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  telegram-notify-test:
    if: |
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/test' &&
      needs.build-test.result != 'cancelled'
    needs:
      - build-test
      - detect-changes
      - codebert-sast
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        uses: appleboy/telegram-action@4cd2253b24c9682a5be99eb6f7ab3484586978fa
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            Master Gateway - push a test

            Build/Test: ${{ needs.build-test.result }}
            CodeBERT SAST: ${{ needs.codebert-sast.result }}
            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}

            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  telegram-notify-main:
    if: |
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.build-test.result != 'cancelled'
    needs:
      - build-test
      - detect-changes
      - sonarqube
      - codebert-sast
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        uses: appleboy/telegram-action@4cd2253b24c9682a5be99eb6f7ab3484586978fa
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            Master Gateway - main (rigor completo)

            Build/Test: ${{ needs.build-test.result }}
            SonarQube: ${{ needs.sonarqube.result }} (gate: ${{ needs.sonarqube.outputs.gate_status }})
            CodeBERT SAST: ${{ needs.codebert-sast.result }}
            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}

            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  telegram-notify-pr:
    if: always() && github.event_name == 'pull_request'
    needs:
      - build-test
      - detect-changes
      - codebert-sast
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        uses: appleboy/telegram-action@4cd2253b24c9682a5be99eb6f7ab3484586978fa
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            Master Gateway - PR #${{ github.event.pull_request.number }}

            Build/Test: ${{ needs.build-test.result }}
            CodeBERT SAST: ${{ needs.codebert-sast.result }}
            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}

            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ──────────────────────────────────────────────────────────────
  # Promocion automatica: dev -> test -> main mediante Pull Requests.
  # El PAT dedicado es necesario para que cada merge dispare el siguiente push.
  # ──────────────────────────────────────────────────────────────
  promote-dev-to-test:
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      needs.detect-changes.result == 'success' &&
      needs.build-test.result == 'success' &&
      needs.codebert-selftest.result == 'success' &&
      (needs.services-build.result == 'success' || needs.services-build.result == 'skipped') &&
      (needs.services-security.result == 'success' || needs.services-security.result == 'skipped')
    needs:
      - detect-changes
      - build-test
      - services-build
      - services-security
      - codebert-selftest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.BRANCH_PROMOTION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Promote dev to test
        run: bash scripts/promote-branch.sh dev test

  promote-test-to-main:
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/test' &&
      needs.detect-changes.result == 'success' &&
      needs.build-test.result == 'success' &&
      needs.codebert-selftest.result == 'success' &&
      (needs.services-build.result == 'success' || needs.services-build.result == 'skipped') &&
      (needs.services-security.result == 'success' || needs.services-security.result == 'skipped') &&
      (
        needs.codebert-sast.result == 'success' ||
        (needs.detect-changes.outputs.has_security_relevant != 'true' && needs.codebert-sast.result == 'skipped')
      )
    needs:
      - detect-changes
      - build-test
      - services-build
      - services-security
      - codebert-selftest
      - codebert-sast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.BRANCH_PROMOTION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Promote test to main
        run: bash scripts/promote-branch.sh test main

  # ──────────────────────────────────────────────────────────────
  # Deploy (solo main, requiere sonarqube OK o skip)
  # ──────────────────────────────────────────────────────────────
  deploy:
    # ESTRATEGIA 4: Solo en main. ESTRATEGIA 2: deploy requiere
    # sonarqube exitoso O que el gate haya sido OK (ya aprobado).
    # codebert-selftest se exige explicitamente: si falla, codebert-sast queda
    # 'skipped' y sin esta condicion un commit sin cambios de seguridad podria
    # desplegarse con el agente SAST averiado.
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build-test.result == 'success' &&
      needs.sonarqube.result == 'success' &&
      needs.sonarqube.outputs.gate_status == 'OK' &&
      needs.codebert-selftest.result == 'success' &&
      (
        needs.codebert-sast.result == 'success' ||
        (needs.detect-changes.outputs.has_security_relevant != 'true' && needs.codebert-sast.result == 'skipped')
      )
    needs:
      - build-test
      - detect-changes
      - sonarqube
      - codebert-sast
      - codebert-selftest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Render CLI
        run: |
          version=2.22.0
          archive="cli_${version}_linux_amd64.zip"
          checksum=6cdcd11897b7bd7e673317e6f4aaf041b654d818444f3b1efec7240a835f79ec
          curl -fsSLO "https://github.com/render-oss/cli/releases/download/v${version}/$archive"
          echo "$checksum  $archive" | sha256sum --check -
          unzip -oq "$archive"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "cli_v${version}" "$HOME/.local/bin/render"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Render backend service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: bash scripts/configure-render-service.sh

      - name: Configure Render database and environment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DATABASE_ID: ${{ secrets.RENDER_DATABASE_ID }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
          JWE_SECRET: ${{ secrets.JWE_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TEMP_JWT_SECRET: ${{ secrets.TEMP_JWT_SECRET }}
          REFRESH_JWT_SECRET: ${{ secrets.REFRESH_JWT_SECRET }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          SEED_ADMIN_EMAIL: ${{ vars.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SEED_SUPER_ADMIN_EMAIL: ${{ vars.SEED_SUPER_ADMIN_EMAIL }}
          SEED_SUPER_ADMIN_PASSWORD: ${{ secrets.SEED_SUPER_ADMIN_PASSWORD }}
          SEED_DEMO_PASSWORD: ${{ secrets.SEED_DEMO_PASSWORD }}
        run: bash scripts/configure-render-environment.sh

      - name: Deploy to Render via CLI
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          render deploys create "$RENDER_SERVICE_ID" \
            --output json \
            --confirm \
            --wait \
            --commit "$GITHUB_SHA"

      - name: Diagnose Render deploy failure
        if: failure()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set +e
          service_json="$(mktemp)"
          deploys_json="$(mktemp)"
          trap 'rm -f "$service_json" "$deploys_json"' EXIT

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID" \
            > "$service_json"
          workspace_id="$(jq -r '.ownerId // empty' "$service_json")"

          echo "::group::Render deploy details"
          curl --fail --silent --show-error \
            --get \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --data-urlencode "limit=1" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            > "$deploys_json"
          jq '.[0].deploy | {id, status, errorMessage, createdAt, finishedAt, commit}' \
            "$deploys_json"
          echo "::endgroup::"

          echo "::group::Render recent service logs"
          if [ -n "$workspace_id" ]; then
            render workspace set "$workspace_id"
          fi
          render logs \
            --resources "$RENDER_SERVICE_ID" \
            --start "$(date -u -d '20 minutes ago' +'%Y-%m-%dT%H:%M:%SZ')" \
            --direction backward \
            --limit 200 \
            --output json
          echo "::endgroup::"

      - name: Notify deploy result
        if: always()
        uses: appleboy/telegram-action@4cd2253b24c9682a5be99eb6f7ab3484586978fa
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            Master Gateway - Despliegue en Render terminado.

            Resultado: ${{ job.status }}
            Commit: ${{ github.sha }}
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
