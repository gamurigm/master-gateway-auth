services:
  postgres:
    image: postgres:16-alpine
    container_name: master-gateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: master_gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d master_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

